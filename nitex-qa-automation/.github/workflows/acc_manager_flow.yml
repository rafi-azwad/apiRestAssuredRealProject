name: Selenium Java CI

on: #[push]
   schedule: # This is the new trigger for the schedule
     - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest # Using linux machine

    steps:
      - uses: actions/checkout@v2 # Checkout the code
      - name: Set up JDK 17
        uses: actions/setup-java@v2 # Setup JAVA
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Install Google Chrome # Using shell script to install Google Chrome
        run: |
          chmod +x ./InstallChrome.sh
           ./InstallChrome.sh
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew # give permission to Gradle to run the commands
      - name: Build with Gradle
        continue-on-error: true
        id: sanityTest
        run: ./gradlew automationWEBTest -DType=createOrder -DBrowser=lamdaTest # Run our tests using Gradle
      - name: Send email report
        # if: steps.sanityTest.outcome != 'success'
        uses: dawidd6/action-send-mail@v2
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{secrets.EMAIL_USERNAME}}
          password: ${{secrets.EMAIL_PASSWORD}}
          subject: Automated Test Report For Account Manager Flow
          body: |
            Hi,
            Please find attached the automated test report.

          #          file://./build/reports/feature.html
          attachments: ./build/reports/webReport/accountManagerJourney/accountManagerJourney.html

          from: Github Actions
          to: rezaulhuq94@gmail.com,md.hn.mahdi@gmail.com,arman@nitex.info,rashed.mahade@nitex.info,tasnim@nitex.info
          content_type: text/html
          # Optional converting Markdown to HTML (set content_type to text/html too):
          convert_markdown: true
